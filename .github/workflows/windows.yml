name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write     # lets the workflow publish a release with the .exe

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # CMake picks the newest Visual Studio installed on the runner.
      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 2>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Self-test (3 peers over TCP on this Windows machine)
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse build -Filter SyncTest.exe | Select-Object -First 1
          $vst = Get-ChildItem -Recurse build -Directory -Filter SyncTestGain.vst3 | Select-Object -First 1
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "--selftest","--plugin=$($vst.FullName)" `
                 -NoNewWindow -Wait -PassThru -RedirectStandardOutput selftest.txt
          Get-Content selftest.txt
          # The key lines also go to the run's public annotations (GitHub shows only
          # about 10 per step, so just failures, totals and measurements).
          Get-Content selftest.txt | Select-String -Pattern "FAIL|passed,|resyncs|step arrived|big file|peak" |
            ForEach-Object { Write-Output "::notice::$($_.Line.Trim())" }
          exit $p.ExitCode

      # Makes the important error lines readable without downloading logs.
      - name: Report errors
        if: failure()
        shell: pwsh
        run: |
          foreach ($f in "configure.log", "build.log", "selftest.txt") {
            if (Test-Path $f) {
              $lines = Get-Content $f | Select-String -Pattern "error|Error|FAIL|CMake Warning|not found" |
                       Select-Object -First 25
              foreach ($l in $lines) { Write-Output "::error title=$f::$($l.Line.Trim())" }
              Get-Content $f -Tail 8 | ForEach-Object { Write-Output "::warning title=$f (end)::$_" }
            }
          }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = Get-ChildItem -Recurse build -Filter SyncTest.exe | Select-Object -First 1
          Copy-Item $exe.FullName dist/
          Copy-Item README.md dist/
          Copy-Item LICENSE dist/LICENSE.txt
          Copy-Item selftest.txt dist/ -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: SyncTest-windows
          path: dist/

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content VERSION.txt -Raw).Trim()
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # A public download link (no GitHub login needed) for every build of main.
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-build${{ github.run_number }}
          name: SyncTest ${{ steps.version.outputs.version }} (build ${{ github.run_number }})
          prerelease: true
          make_latest: true
          body: |
            Test build of the multiplayer DAW. Download **SyncTest.exe** below; README.md explains how to use it and how to test with a friend.
            Self-test on Windows: passed (3 peers over TCP).
          files: |
            dist/SyncTest.exe
            dist/README.md
