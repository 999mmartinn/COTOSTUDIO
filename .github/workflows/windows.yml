name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write     # lets the workflow publish a release with the .exe

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # ASIO (the low-latency driver of audio interfaces such as the Behringer UMC):
      # Steinberg's ASIO SDK is dual-licensed GPLv3 / proprietary since October 2025.
      # It is downloaded from Steinberg and used only if its licence file says GPL;
      # otherwise the app is built without ASIO (Windows Audio only), as before.
      - name: Get the ASIO SDK
        shell: pwsh
        continue-on-error: true
        run: |
          Invoke-WebRequest -Uri "https://www.steinberg.net/asiosdk" -OutFile asiosdk.zip
          Expand-Archive asiosdk.zip -DestinationPath asiosdk -Force
          $header = Get-ChildItem -Recurse asiosdk -Filter iasiodrv.h | Select-Object -First 1
          $gpl = $false
          foreach ($f in Get-ChildItem -Recurse asiosdk -File | Where-Object { $_.Name -match 'licen|copying|readme' }) {
            $hit = Select-String -Path $f.FullName -Pattern 'GNU General Public License' -SimpleMatch | Select-Object -First 1
            if ($hit) { $gpl = $true; Write-Output "::notice::ASIO SDK: $($f.Name): $($hit.Line.Trim())" }
          }
          if ($header -and $gpl) {
            "ASIO_SDK=$($header.Directory.Parent.FullName.Replace('\', '/'))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Output "::notice::ASIO SDK used: $((Get-Item asiosdk.zip).Length) bytes, headers in $($header.Directory.FullName)"
          } else {
            Write-Output "::warning::ASIO SDK not used (header found: $([bool]$header), GPL licence found: $gpl)"
          }

      # CMake picks the newest Visual Studio installed on the runner.
      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 "-DSYNCTEST_ASIO_SDK=$env:ASIO_SDK" 2>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content configure.log | Select-String -Pattern "ASIO support" | ForEach-Object { Write-Output "::notice::$($_.Line.Trim())" }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Self-test (3 peers over TCP on this Windows machine)
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse build -Filter COTOSTUDIO.exe | Select-Object -First 1
          $vst = Get-ChildItem -Recurse build -Directory -Filter SyncTestGain.vst3 | Select-Object -First 1
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "--selftest","--plugin=$($vst.FullName)" `
                 -NoNewWindow -Wait -PassThru -RedirectStandardOutput selftest.txt
          Get-Content selftest.txt
          # The key lines also go to the run's public annotations (GitHub shows only
          # about 10 per step, so just failures, totals and measurements).
          Get-Content selftest.txt | Select-String -Pattern "FAIL|passed,|resyncs|step arrived|the take starts|mp3: |mix: |error: " |
            ForEach-Object { Write-Output "::notice::$($_.Line.Trim())" }
          # If it failed (or stopped early), its last lines as one readable note.
          if ($p.ExitCode -ne 0) {
            $tail = (Get-Content selftest.txt -Tail 40 | ForEach-Object { $_.Replace('%', '%25') }) -join '%0A'
            Write-Output "::error title=selftest.txt (last 40 lines, exit code $($p.ExitCode))::$tail"
          }
          exit $p.ExitCode

      # Makes the important error lines readable without downloading logs.
      - name: Report errors
        if: failure()
        shell: pwsh
        run: |
          foreach ($f in "configure.log", "build.log", "selftest.txt") {
            if (Test-Path $f) {
              $lines = Get-Content $f | Select-String -Pattern "error|Error|FAIL|CMake Warning|not found" |
                       Select-Object -First 25
              foreach ($l in $lines) { Write-Output "::error title=$f::$($l.Line.Trim())" }
              Get-Content $f -Tail 8 | ForEach-Object { Write-Output "::warning title=$f (end)::$_" }
            }
          }

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content VERSION.txt -Raw).Trim()
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # dist/ holds the release files; the zip has the program with its README and
      # every licence (AGPLv3, the fonts' OFL, Signalsmith's MIT, ASIO's GPLv3 source when used).
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist, pkg, pkg/licences | Out-Null
          $exe = Get-ChildItem -Recurse build -Filter COTOSTUDIO.exe | Select-Object -First 1
          Copy-Item $exe.FullName dist/
          Copy-Item README.md dist/
          Copy-Item selftest.txt dist/ -ErrorAction SilentlyContinue
          # The GPL source of the ASIO part travels with the program (GPLv3 / AGPLv3).
          if ($env:ASIO_SDK) { Copy-Item asiosdk.zip dist/ASIO-SDK-source-GPLv3.zip }

          Copy-Item $exe.FullName pkg/
          Copy-Item README.md pkg/
          Copy-Item LICENSE pkg/LICENSE.txt
          Copy-Item Resources/Fonts/Inter-LICENSE.txt pkg/licences/Inter-OFL.txt
          Copy-Item Resources/Fonts/JetBrainsMono-LICENSE.txt pkg/licences/JetBrainsMono-OFL.txt
          # Time-stretching (audio clips' speed and pitch): Signalsmith Stretch, MIT licence.
          Copy-Item external/tracktion_engine/modules/tracktion_engine/3rd_party/signalsmith-stretch/LICENSE.txt pkg/licences/Signalsmith-Stretch-MIT.txt
          Copy-Item external/tracktion_engine/modules/tracktion_engine/3rd_party/signalsmith-stretch/signalsmith-linear/LICENSE.txt pkg/licences/Signalsmith-Linear-MIT.txt
          # VST2 hosting: the FST headers (GPLv3 or later), with their licence and our changes.
          Copy-Item external/fst/LICENSE pkg/licences/FST-GPLv3.txt
          Copy-Item external/fst/README.md pkg/licences/FST-README.md
          if ($env:ASIO_SDK) {
            Copy-Item asiosdk.zip pkg/licences/ASIO-SDK-source-GPLv3.zip
            "ASIO is a trademark and software of Steinberg Media Technologies GmbH." | Out-File pkg/licences/ASIO.txt -Encoding utf8
          }
          Compress-Archive -Path pkg/* -DestinationPath "dist/COTOSTUDIO-${{ steps.version.outputs.version }}-windows.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: COTOSTUDIO-windows
          path: dist/

      # A public download link (no GitHub login needed) for every build of main.
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-build${{ github.run_number }}
          name: COTOSTUDIO ${{ steps.version.outputs.version }} (build ${{ github.run_number }})
          prerelease: false
          make_latest: true
          body: |
            COTOSTUDIO, the multiplayer DAW. Download **COTOSTUDIO.exe** below (or the zip, which also has the README and the licences); README.md explains what's new, where your files go and how to play with friends.
            Self-test on Windows: passed (3 peers over TCP).
            Free software under the GNU AGPLv3. Fonts: Inter and JetBrains Mono (SIL Open Font License). Time-stretching: Signalsmith Stretch (MIT). VST2 hosting: FST headers (GPLv3 or later, in external/fst).
            ASIO is a trademark and software of Steinberg Media Technologies GmbH.
            VST is a trademark of Steinberg Media Technologies GmbH.
          files: |
            dist/COTOSTUDIO.exe
            dist/COTOSTUDIO-${{ steps.version.outputs.version }}-windows.zip
            dist/README.md
            dist/ASIO-SDK-source-GPLv3.zip
          fail_on_unmatched_files: false
